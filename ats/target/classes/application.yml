spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: ats-project

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/atsproject
    username: postgres
    password: 25102005
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8081

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000



# MinIO Configuration
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: cv-files

# PDF Extraction Configuration
cv:
  pdf:
    sort-by-position: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
ats:
  skills:
    seed:
      enabled: false

nlp:
  base-url: http://127.0.0.1:8000
  connect-timeout: 3s
  read-timeout: 30s