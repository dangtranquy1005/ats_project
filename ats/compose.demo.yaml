name: ats-demo
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ats_demo
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in .env.demo}
    volumes:
      - demo-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ats -d ats_demo']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${DEMO_MINIO_USER:-ats-demo}
      MINIO_ROOT_PASSWORD: ${DEMO_MINIO_PASSWORD:?Set DEMO_MINIO_PASSWORD in .env.demo}
    volumes:
      - demo-pdf:/data
  nlpservice:
    build: ../nlpservice
    environment:
      NLP_MODE: full
    healthcheck:
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 30
  backend:
    build: .
    environment:
      SERVER_PORT: 8081
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SPRING_APPLICATION_NAME: ats-demo
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ats_demo
      SPRING_DATASOURCE_USERNAME: ats
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: 'false'
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 30MB
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${DEMO_MINIO_USER:-ats-demo}
      MINIO_SECRET_KEY: ${DEMO_MINIO_PASSWORD}
      MINIO_BUCKET_NAME: cv-files
      JWT_SECRET: ${DEMO_JWT_SECRET:?Set DEMO_JWT_SECRET in .env.demo}
      JWT_EXPIRATION: 86400000
      ATS_SKILLS_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      NLP_BASE_URL: http://nlpservice:8000
      NLP_CONNECT_TIMEOUT: 3s
      NLP_READ_TIMEOUT: 60s
    ports:
      - '127.0.0.1:${DEMO_API_PORT:-8083}:8081'
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      nlpservice:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ../frontend
    ports:
      - '127.0.0.1:${DEMO_WEB_PORT:-8090}:80'
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
volumes:
  demo-db:
  demo-pdf:
