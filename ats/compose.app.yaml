name: ats-app
services:
  backend:
    build: .
    env_file: .env.docker
    ports:
      - "127.0.0.1:${ATS_HTTP_PORT:-8082}:8081"
    networks:
      - nlp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  nlp:
    external: true
    name: ${NLP_DOCKER_NETWORK:-nlpservice_default}
